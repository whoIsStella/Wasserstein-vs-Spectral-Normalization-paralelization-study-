[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gan-parallelization-bench"
version = "0.1.0"
description = "Portable benchmark for WGAN-GP and spectral-normalized GAN training"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gan_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
